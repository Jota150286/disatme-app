<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111820"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="DISATME"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><title>DISATME — Gestión</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9edf0;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{width:min(520px,100%);min-height:100vh;margin:auto;background:#f5f7f8;padding-bottom:82px}.top{background:#111820;color:#fff;padding:18px;border-radius:0 0 24px 24px}.brand{font-weight:900;letter-spacing:2px}.sub,.muted{font-size:11px;color:#71808c}.top .sub{color:#fff8; margin-top:4px}.top h1{margin:20px 0 3px;font-size:26px}.metrics,.grid2,.grid3{display:grid;gap:9px}.metrics,.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}.metric,.card,.item{background:#fff;border-radius:15px;padding:13px;box-shadow:0 4px 18px #11182010;margin-bottom:9px}.label{font-size:10px;color:#71808c}.big{font-size:19px;font-weight:900;margin-top:5px}.green{color:#17864e}.red{color:#c83d3d}.amber{color:#a96d15}.view{display:none}.view.active{display:block}section{padding:0 16px;margin-top:18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:900}.toolbar{padding:14px 16px 0;display:flex;gap:8px}.search,select,input,textarea{width:100%;border:1px solid #e2e6e9;border-radius:11px;background:#fff;padding:11px;font:inherit;font-size:13px}.btn{border:0;border-radius:11px;padding:10px 12px;font-weight:800;font-size:12px;background:#fff;cursor:pointer}.primary{background:#111820;color:#fff}.danger{background:#fde6e6;color:#c83d3d}.pill{font-size:9px;padding:5px 8px;border-radius:20px;background:#dff4e8;color:#17864e;font-weight:800;white-space:nowrap}.pill.warn{background:#fff1d4;color:#a96d15}.pill.red{background:#fde6e6;color:#c83d3d}.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.title{font-size:14px;font-weight:900}.progress{height:7px;background:#e8ecef;border-radius:8px;margin-top:10px;overflow:hidden}.bar{height:100%;background:#17864e}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.task{display:flex;gap:10px;align-items:center}.dot{width:9px;height:9px;border-radius:50%;background:#c83d3d;flex:none}.dot.m{background:#e2a32b}.dot.l{background:#37a76b}.done{opacity:.55}.done .title{text-decoration:line-through}.empty{text-align:center;padding:28px;color:#71808c}.details{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee;font-size:12px}.chart{height:150px;display:flex;align-items:flex-end;gap:8px;padding:12px;background:#fff;border-radius:15px}.vbar{flex:1;background:#111820;border-radius:6px 6px 2px 2px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:72px;background:#fff;border-top:1px solid #e5e8eb;display:flex;align-items:center;justify-content:space-around;z-index:20}.nav button{border:0;background:none;font-size:10px;color:#7b838c}.nav .active{color:#111820;font-weight:900}.plus{width:48px;height:48px;border-radius:50%!important;background:#111820!important;color:#fff!important;font-size:24px!important}.modal{position:fixed;inset:0;background:#0008;z-index:50;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{width:min(520px,100%);max-height:92vh;overflow:auto;background:#f5f7f8;border-radius:22px 22px 0 0;padding:16px}.sheethead{display:flex;justify-content:space-between;align-items:center}.sheet h2{margin:0 0 12px;font-size:19px}.x{border:0;border-radius:50%;width:34px;height:34px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{margin-bottom:9px}.field.full{grid-column:1/-1}.field label{display:block;font-size:10px;color:#71808c;font-weight:800;margin-bottom:4px}.formactions{display:flex;justify-content:flex-end;gap:7px;margin-top:7px}.menu{display:grid;grid-template-columns:1fr 1fr;gap:9px}.menu button{text-align:left;padding:15px;background:#fff;border:0;border-radius:15px;box-shadow:0 4px 18px #11182010;font-weight:800}.menu span{display:block;color:#71808c;font-size:10px;font-weight:500;margin-top:4px}@media(max-width:360px){.grid3{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}}
</style></head><body><div class="app"><header class="top"><div class="brand">DISATME</div><div class="sub">Diseño · Fabricación · Transformación</div><h1 id="greet"></h1><div class="sub" id="date"></div><div class="metrics"><div class="metric"><div class="label">Ventas</div><div class="big" id="sales"></div></div><div class="metric"><div class="label">Utilidad</div><div class="big green" id="profit"></div></div></div></header>
<div id="home" class="view active"><section><div class="head">Resumen <span class="muted" id="sum"></span></div><div class="grid3"><div class="card"><div class="muted">Proyectos</div><div class="big" id="kp"></div></div><div class="card"><div class="muted">Tareas</div><div class="big" id="kt"></div></div><div class="card"><div class="muted">Cartera</div><div class="big red" id="kr"></div></div></div></section><section><div class="head">Proyectos <button class="btn" onclick="nav('projects')">Ver todos</button></div><div id="homeProjects"></div></section><section><div class="head">Tareas de hoy <span class="muted" id="todayN"></span></div><div id="homeTasks"></div></section></div>
<div id="projects" class="view"><div class="toolbar"><input id="ps" class="search" placeholder="🔎 Buscar proyecto" oninput="renderProjects()"><button class="btn primary" onclick="projectForm()">+ Proyecto</button></div><section><div class="head">Todos los proyectos <span class="muted" id="pc"></span></div><div id="projectList"></div></section></div>
<div id="tasks" class="view"><div class="toolbar"><input id="ts" class="search" placeholder="🔎 Buscar tarea" oninput="renderTasks()"><button class="btn primary" onclick="taskForm()">+ Tarea</button></div><section><div class="head">Tareas <span class="muted" id="tc"></span></div><div id="taskList"></div></section></div>
<div id="clients" class="view"><div class="toolbar"><input id="cs" class="search" placeholder="🔎 Buscar cliente" oninput="renderClients()"><button class="btn primary" onclick="clientForm()">+ Cliente</button></div><section><div class="head">Clientes <span class="muted" id="cc"></span></div><div id="clientList"></div></section></div>
<div id="apu" class="view"><div class="toolbar"><select id="apSel" onchange="renderAPU()"></select><button class="btn primary" onclick="apuForm()">+ Recurso</button></div><section><div class="head">APU y costos</div><div id="apuSummary"></div><div id="apuList"></div></section></div>
<div id="payments" class="view"><div class="toolbar"><input id="payS" class="search" placeholder="🔎 Buscar pago" oninput="renderPayments()"><button class="btn primary" onclick="paymentForm()">+ Pago</button></div><section><div class="head">Pagos y cartera <span class="muted" id="payc"></span></div><div id="paymentSummary"></div><div id="paymentList"></div></section></div>
<div id="reports" class="view"><section><div class="head">Reportes</div><div id="reportK" class="grid2"></div><div class="item" style="margin-top:10px"><b>Pagos de los últimos 6 meses</b><div class="chart" id="chart"></div></div><div class="item"><div class="details"><span>Ventas</span><b id="rs"></b></div><div class="details"><span>Costos</span><b id="rc"></b></div><div class="details"><span>Utilidad</span><b class="green" id="rp"></b></div><div class="details"><span>Margen</span><b id="rm"></b></div></div></section></div>
<div id="more" class="view"><section><div class="head">Más</div><div class="menu"><button onclick="settingsForm()">⚙️ Configuración<span>Empresa e indirectos APU</span></button><button onclick="exportData()">⬇️ Exportar<span>Backup de datos</span></button><button onclick="document.getElementById('imp').click()">⬆️ Importar<span>Restaurar backup</span></button><button onclick="resetDemo()">↻ Demo<span>Restaurar datos de ejemplo</span></button></div><input id="imp" type="file" accept="application/json" hidden onchange="importData(event)"></section></div>
<nav class="nav"><button data-v="home" onclick="nav('home',this)">⌂<br>Inicio</button><button data-v="projects" onclick="nav('projects',this)">▣<br>Proyectos</button><button class="plus" onclick="quickAdd()">+</button><button data-v="tasks" onclick="nav('tasks',this)">✓<br>Tareas</button><button data-v="more" onclick="nav('more',this)">☰<br>Más</button></nav></div>
<div class="modal" id="modal"><div class="sheet"><div class="sheethead"><h2 id="mt"></h2><button class="x" onclick="closeM()">×</button></div><div id="mb"></div></div></div>
<script>
const KEY='DISATME_FULL_2';const demo={settings:{company:'DISATME',indirect:15},clients:[{id:'c1',name:'Ana García',phone:'300 000 0000',email:'ana@ejemplo.com',address:''},{id:'c2',name:'Carlos Torres',phone:'301 000 0000',email:'carlos@ejemplo.com',address:''}],projects:[{id:'p1',name:'Cocina Apartamento P.H.',clientId:'c1',status:'En ejecución',progress:70,sale:18500000,cost:11200000,start:'',end:'',notes:''},{id:'p2',name:'Cocina Torres',clientId:'c2',status:'Pendiente',progress:45,sale:32000000,cost:19000000,start:'',end:'',notes:''},{id:'p3',name:'Closet Habitación',clientId:'c1',status:'Terminado',progress:100,sale:12800000,cost:7600000,start:'',end:'',notes:''}],tasks:[{id:'t1',title:'Comprar herrajes',projectId:'p1',date:'',time:'08:00',priority:'Crítica',done:false,notes:''},{id:'t2',title:'Llamar cliente García',projectId:'p1',date:'',time:'10:00',priority:'Alta',done:false,notes:''}],apu:[{id:'a1',projectId:'p1',name:'RH Fresno Europeo',qty:8.5,unit:'m²',unitCost:320000},{id:'a2',projectId:'p1',name:'Herrajes',qty:12,unit:'und',unitCost:85000},{id:'a3',projectId:'p1',name:'Cubierta sinterizada',qty:4.2,unit:'m²',unitCost:450000},{id:'a4',projectId:'p1',name:'Mano de obra',qty:20,unit:'h',unitCost:45000}],payments:[{id:'pay1',projectId:'p1',date:'',amount:10000000,method:'Transferencia',note:'Anticipo'},{id:'pay2',projectId:'p2',date:'',amount:8000000,method:'Transferencia',note:'Anticipo'}]};
let db=load();function clone(x){return JSON.parse(JSON.stringify(x))}function load(){try{return JSON.parse(localStorage.getItem(KEY))||clone(demo)}catch(e){return clone(demo)}}function save(){localStorage.setItem(KEY,JSON.stringify(db));renderAll()}function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function today(){return new Date().toISOString().slice(0,10)}function money(n){return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(+n||0)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function cn(i){return db.clients.find(x=>x.id===i)?.name||'Sin cliente'}function pn(i){return db.projects.find(x=>x.id===i)?.name||'Sin proyecto'}function cost(pid){return db.apu.filter(a=>a.projectId===pid).reduce((s,a)=>s+(+a.qty||0)*(+a.unitCost||0),0)}function paid(pid){return db.payments.filter(p=>p.projectId===pid).reduce((s,p)=>s+(+p.amount||0),0)}
function nav(v,b){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(v).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));let q=b||document.querySelector('[data-v="'+v+'"]');if(q)q.classList.add('active');renderAll();scrollTo(0,0)}function openM(t,h){mt.textContent=t;mb.innerHTML=h;modal.classList.add('show')}function closeM(){modal.classList.remove('show')}function f(label,name,val='',type='text',extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(val)}" ${extra}></div>`}function sel(label,name,opts,val){return `<div class="field"><label>${label}</label><select name="${name}">${opts.map(o=>`<option value="${esc(o[0])}" ${o[0]==val?'selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`}function optsProjects(){return db.projects.map(p=>[p.id,p.name])}
function projectForm(pid){let p=db.projects.find(x=>x.id===pid)||{id:'',name:'',clientId:db.clients[0]?.id||'',status:'Pendiente',progress:0,sale:0,cost:0,start:today(),end:'',notes:''};openM(pid?'Editar proyecto':'Nuevo proyecto',`<form id="form"><div class="formgrid">${f('Nombre','name',p.name)}${sel('Cliente','clientId',db.clients.map(c=>[c.id,c.name]),p.clientId)}${sel('Estado','status',[['Pendiente','Pendiente'],['En ejecución','En ejecución'],['Pausado','Pausado'],['Terminado','Terminado'],['Cancelado','Cancelado']],p.status)}${f('Avance %','progress',p.progress,'number','min="0" max="100"')}${f('Precio de venta','sale',p.sale,'number','min="0"')}${f('Costo estimado','cost',p.cost,'number','min="0"')}${f('Inicio','start',p.start,'date')}${f('Entrega','end',p.end,'date')}<div class="field full"><label>Notas</label><textarea name="notes">${esc(p.notes)}</textarea></div></div><div class="formactions"><button type="button" class="btn" onclick="closeM()">Cancelar</button>${pid?`<button type="button" class="btn danger" onclick="delProject('${pid}')">Eliminar</button>`:''}<button class="btn primary">Guardar</button></div></form>`);form.onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(form));Object.assign(p,{...o,progress:+o.progress||0,sale:+o.sale||0,cost:+o.cost||0});if(!pid)db.projects.push({...p,id:id()});save();closeM()}}
function delProject(i){if(!confirm('¿Eliminar proyecto y sus tareas, APU y pagos?'))return;db.projects=db.projects.filter(x=>x.id!==i);db.tasks=db.tasks.filter(x=>x.projectId!==i);db.apu=db.apu.filter(x=>x.projectId!==i);db.payments=db.payments.filter(x=>x.projectId!==i);save();closeM()}
function taskForm(tid){let t=db.tasks.find(x=>x.id===tid)||{id:'',title:'',projectId:db.projects[0]?.id||'',date:today(),time:'',priority:'Media',done:false,notes:''};openM(tid?'Editar tarea':'Nueva tarea',`<form id="form"><div class="formgrid">${f('Tarea','title',t.title)}${sel('Proyecto','projectId',optsProjects(),t.projectId)}${f('Fecha','date',t.date,'date')}${f('Hora','time',t.time,'time')}${sel('Prioridad','priority',[['Crítica','Crítica'],['Alta','Alta'],['Media','Media'],['Baja','Baja']],t.priority)}${sel('Estado','done',[['false','Pendiente'],['true','Completada']],String(t.done))}<div class="field full"><label>Notas</label><textarea name="notes">${esc(t.notes)}</textarea></div></div><div class="formactions"><button type="button" class="btn" onclick="closeM()">Cancelar</button>${tid?`<button type="button" class="btn danger" onclick="delTask('${tid}')">Eliminar</button>`:''}<button class="btn primary">Guardar</button></div></form>`);form.onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(form));Object.assign(t,{...o,done:o.done==='true'});if(!tid)db.tasks.push({...t,id:id()});save();closeM()}}function delTask(i){if(confirm('¿Eliminar tarea?')){db.tasks=db.tasks.filter(x=>x.id!==i);save();closeM()}}function toggle(i){let t=db.tasks.find(x=>x.id===i);if(t)t.done=!t.done;save()}
function clientForm(cid){let c=db.clients.find(x=>x.id===cid)||{id:'',name:'',phone:'',email:'',address:'',notes:''};openM(cid?'Editar cliente':'Nuevo cliente',`<form id="form"><div class="formgrid">${f('Nombre','name',c.name)}${f('Teléfono','phone',c.phone,'tel')}${f('Correo','email',c.email,'email')}${f('Dirección','address',c.address)}<div class="field full"><label>Notas</label><textarea name="notes">${esc(c.notes||'')}</textarea></div></div><div class="formactions"><button type="button" class="btn" onclick="closeM()">Cancelar</button>${cid?`<button type="button" class="btn danger" onclick="delClient('${cid}')">Eliminar</button>`:''}<button class="btn primary">Guardar</button></div></form>`);form.onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(form));Object.assign(c,o);if(!cid)db.clients.push({...c,id:id()});save();closeM()}}function delClient(i){if(db.projects.some(p=>p.clientId===i))return alert('No se puede eliminar: tiene proyectos asociados.');if(confirm('¿Eliminar cliente?')){db.clients=db.clients.filter(x=>x.id!==i);save();closeM()}}
function apuForm(aid){let pid=apSel.value||db.projects[0]?.id;let a=db.apu.find(x=>x.id===aid)||{id:'',projectId:pid,name:'',qty:1,unit:'und',unitCost:0};openM(aid?'Editar recurso':'Nuevo recurso APU',`<form id="form"><div class="formgrid">${sel('Proyecto','projectId',optsProjects(),a.projectId)}${f('Recurso','name',a.name)}${f('Cantidad','qty',a.qty,'number','min="0" step="0.01"')}${f('Unidad','unit',a.unit)}${f('Costo unitario','unitCost',a.unitCost,'number','min="0" step="1"')}</div><div class="formactions"><button type="button" class="btn" onclick="closeM()">Cancelar</button>${aid?`<button type="button" class="btn danger" onclick="delAPU('${aid}')">Eliminar</button>`:''}<button class="btn primary">Guardar</button></div></form>`);form.onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(form));Object.assign(a,{...o,qty:+o.qty||0,unitCost:+o.unitCost||0});if(!aid)db.apu.push({...a,id:id()});save();closeM()}}function delAPU(i){db.apu=db.apu.filter(x=>x.id!==i);save();closeM()}
function paymentForm(pid){let p=db.payments.find(x=>x.id===pid)||{id:'',projectId:db.projects[0]?.id||'',date:today(),amount:0,method:'Transferencia',note:''};openM(pid?'Editar pago':'Nuevo pago',`<form id="form"><div class="formgrid">${sel('Proyecto','projectId',optsProjects(),p.projectId)}${f('Fecha','date',p.date,'date')}${f('Monto','amount',p.amount,'number','min="0"')}${sel('Método','method',[['Transferencia','Transferencia'],['Efectivo','Efectivo'],['Tarjeta','Tarjeta'],['Cheque','Cheque'],['Otro','Otro']],p.method)}<div class="field full"><label>Nota</label><textarea name="note">${esc(p.note)}</textarea></div></div><div class="formactions"><button type="button" class="btn" onclick="closeM()">Cancelar</button>${pid?`<button type="button" class="btn danger" onclick="delPay('${pid}')">Eliminar</button>`:''}<button class="btn primary">Guardar</button></div></form>`);form.onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(form));Object.assign(p,{...o,amount:+o.amount||0});if(!pid)db.payments.push({...p,id:id()});save();closeM()}}function delPay(i){db.payments=db.payments.filter(x=>x.id!==i);save();closeM()}
function projectCard(p){let cls=p.status==='Pendiente'?'warn':p.status==='Cancelado'?'red':'';return `<div class="item"><div class="row"><div><div class="title">${esc(p.name)}</div><div class="muted">${esc(cn(p.clientId))} · ${money(p.sale)}</div></div><span class="pill ${cls}">${esc(p.status)}</span></div><div class="progress"><div class="bar" style="width:${p.progress}%"></div></div><div class="actions"><button class="btn" onclick="projectForm('${p.id}')">✏️ Editar</button><button class="btn" onclick="detail('${p.id}')">📋 Detalle</button></div></div>`}function taskCard(t){let d=t.priority==='Media'?'m':t.priority==='Baja'?'l':'';return `<div class="item task ${t.done?'done':''}"><i class="dot ${d}"></i><div style="flex:1"><div class="title">${esc(t.title)}</div><div class="muted">${t.date||'Sin fecha'} ${t.time?'· '+t.time:''} · ${esc(pn(t.projectId))} · ${esc(t.priority)}</div></div><button class="btn" onclick="toggle('${t.id}')">${t.done?'↩':'✓'}</button><button class="btn" onclick="taskForm('${t.id}')">✏️</button></div>`}
function renderHome(){let s=db.projects.reduce((a,p)=>a+p.sale,0),c=db.projects.reduce((a,p)=>a+(p.cost||cost(p.id)),0),r=db.projects.reduce((a,p)=>a+Math.max(0,p.sale-paid(p.id)),0);sales.textContent=money(s);profit.textContent=money(s-c);kp.textContent=db.projects.length;kt.textContent=db.tasks.filter(t=>!t.done).length;kr.textContent=money(r);sum.textContent=db.clients.length+' clientes';todayN.textContent=db.tasks.filter(t=>t.date===today()&&!t.done).length+' pendientes';homeProjects.innerHTML=db.projects.slice(0,3).map(projectCard).join('')||'<div class="empty">No hay proyectos</div>';homeTasks.innerHTML=db.tasks.filter(t=>t.date===today()).slice(0,5).map(taskCard).join('')||'<div class="empty">No hay tareas para hoy</div>'}
function renderProjects(){let q=(ps?.value||'').toLowerCase(),a=db.projects.filter(p=>(p.name+' '+cn(p.clientId)+' '+p.status).toLowerCase().includes(q));pc.textContent=a.length;projectList.innerHTML=a.map(projectCard).join('')||'<div class="empty">No hay proyectos</div>'}function renderTasks(){let q=(ts?.value||'').toLowerCase(),a=db.tasks.filter(t=>(t.title+' '+pn(t.projectId)+' '+t.priority).toLowerCase().includes(q)).sort((a,b)=>a.done-b.done||a.date.localeCompare(b.date));tc.textContent=a.filter(x=>!x.done).length+' abiertas';taskList.innerHTML=a.map(taskCard).join('')||'<div class="empty">No hay tareas</div>'}function renderClients(){let q=(cs?.value||'').toLowerCase(),a=db.clients.filter(c=>(c.name+' '+c.phone+' '+c.email).toLowerCase().includes(q));cc.textContent=a.length;clientList.innerHTML=a.map(c=>`<div class="item"><div class="row"><div><div class="title">${esc(c.name)}</div><div class="muted">${esc(c.phone||'Sin teléfono')} · ${esc(c.email||'Sin correo')}</div></div><span class="pill">${db.projects.filter(p=>p.clientId===c.id).length} proyectos</span></div><div class="muted">${esc(c.address||'Sin dirección')}</div><div class="actions"><button class="btn" onclick="clientForm('${c.id}')">✏️ Editar</button></div></div>`).join('')||'<div class="empty">No hay clientes</div>'}
function renderAPU(){apSel.innerHTML=db.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');let p=db.projects.find(x=>x.id===apSel.value)||db.projects[0];if(!p){apuSummary.innerHTML='<div class="empty">Crea un proyecto primero</div>';apuList.innerHTML='';return}apSel.value=p.id;let direct=cost(p.id),ind=direct*(+db.settings.indirect||0)/100,total=p.cost||direct+ind,util=p.sale-total,margin=p.sale?util/p.sale*100:0;apuSummary.innerHTML=`<div class="card"><div class="details"><span>Costo directo</span><b>${money(direct)}</b></div><div class="details"><span>Indirectos</span><b>${money(ind)}</b></div><div class="details"><span>Costo registrado</span><b>${money(p.cost)}</b></div><div class="details"><span>Venta</span><b>${money(p.sale)}</b></div><div class="details"><span>Utilidad</span><b class="green">${money(util)}</b></div><div class="details"><span>Margen</span><b>${margin.toFixed(1)}%</b></div></div>`;apuList.innerHTML=db.apu.filter(a=>a.projectId===p.id).map(a=>`<div class="item"><div class="row"><div><div class="title">${esc(a.name)}</div><div class="muted">${a.qty} ${esc(a.unit)} × ${money(a.unitCost)}</div></div><b>${money(a.qty*a.unitCost)}</b></div><div class="actions"><button class="btn" onclick="apuForm('${a.id}')">✏️ Editar</button></div></div>`).join('')||'<div class="empty">No hay recursos</div>'}
function renderPayments(){let q=(payS?.value||'').toLowerCase(),a=db.payments.filter(p=>(pn(p.projectId)+' '+p.method+' '+p.note).toLowerCase().includes(q));let got=a.reduce((s,p)=>s+p.amount,0),car=db.projects.reduce((s,p)=>s+Math.max(0,p.sale-paid(p.id)),0);payc.textContent=a.length;paymentSummary.innerHTML=`<div class="grid2"><div class="card"><div class="muted">Cobrado</div><div class="big green">${money(got)}</div></div><div class="card"><div class="muted">Cartera</div><div class="big red">${money(car)}</div></div></div>`;paymentList.innerHTML=a.map(p=>`<div class="item"><div class="row"><div><div class="title">${esc(pn(p.projectId))}</div><div class="muted">${esc(p.date)} · ${esc(p.method)} · ${esc(p.note||'')}</div></div><b class="green">${money(p.amount)}</b></div><div class="actions"><button class="btn" onclick="paymentForm('${p.id}')">✏️ Editar</button></div></div>`).join('')||'<div class="empty">No hay pagos</div>'}
function renderReports(){let s=db.projects.reduce((a,p)=>a+p.sale,0),c=db.projects.reduce((a,p)=>a+(p.cost||cost(p.id)),0),pr=s-c,m=s?pr/s*100:0;reportK.innerHTML=`<div class="card"><div class="muted">Ventas</div><div class="big">${money(s)}</div></div><div class="card"><div class="muted">Utilidad</div><div class="big green">${money(pr)}</div></div><div class="card"><div class="muted">Margen</div><div class="big">${m.toFixed(1)}%</div></div><div class="card"><div class="muted">Activos</div><div class="big">${db.projects.filter(p=>p.status==='En ejecución').length}</div></div>`;rs.textContent=money(s);rc.textContent=money(c);rp.textContent=money(pr);rm.textContent=m.toFixed(1)+'%';let vals=[];for(let i=5;i>=0;i--){let d=new Date();d.setMonth(d.getMonth()-i);vals.push(db.payments.filter(p=>{let x=new Date(p.date);return x.getMonth()===d.getMonth()&&x.getFullYear()===d.getFullYear()}).reduce((a,p)=>a+p.amount,0))}let max=Math.max(...vals,1);chart.innerHTML=vals.map(v=>`<div class="vbar" style="height:${Math.max(4,v/max*100)}%" title="${money(v)}"></div>`).join('')}
function renderAll(){renderHome();renderProjects();renderTasks();renderClients();renderAPU();renderPayments();renderReports();let h=new Date().getHours();greet.textContent=h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches';date.textContent=new Date().toLocaleDateString('es-CO',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}
function detail(i){let p=db.projects.find(x=>x.id===i),c=p.cost||cost(i),g=paid(i),u=p.sale-c;openM('Detalle',`<div class="card"><div class="title">${esc(p.name)}</div><div class="muted">${esc(cn(p.clientId))}</div><div class="details"><span>Venta</span><b>${money(p.sale)}</b></div><div class="details"><span>Costo</span><b>${money(c)}</b></div><div class="details"><span>Utilidad</span><b class="green">${money(u)}</b></div><div class="details"><span>Cobrado</span><b>${money(g)}</b></div><div class="details"><span>Saldo</span><b class="red">${money(Math.max(0,p.sale-g))}</b></div></div><div class="actions"><button class="btn primary" onclick="closeM();projectForm('${i}')">✏️ Editar</button><button class="btn" onclick="closeM();apSel.value='${i}';nav('apu')">🧮 APU</button></div>`)}
function quickAdd(){openM('Crear nuevo',`<div class="menu"><button onclick="closeM();projectForm()">📁 Proyecto<span>Nuevo proyecto</span></button><button onclick="closeM();taskForm()">✓ Tarea<span>Nueva tarea</span></button><button onclick="closeM();clientForm()">👤 Cliente<span>Nuevo cliente</span></button><button onclick="closeM();apuForm()">🧮 APU<span>Nuevo recurso</span></button><button onclick="closeM();paymentForm()">💰 Pago<span>Registrar cobro</span></button></div>`)}
function settingsForm(){openM('Configuración',`<form id="form">${f('Nombre de empresa','company',db.settings.company)}${f('Indirectos APU %','indirect',''+db.settings.indirect,'number','min="0" max="100" step="0.1"')}<div class="formactions"><button type="button" class="btn" onclick="closeM()">Cancelar</button><button class="btn primary">Guardar</button></div></form>`);form.onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(form));db.settings={company:o.company,indirect:+o.indirect||0};save();closeM()}}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='DISATME-backup-'+today()+'.json';a.click()}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.projects||!x.tasks||!x.clients)throw 1;db=x;save();alert('Datos importados')}catch(_){alert('Backup no válido')}};r.readAsText(f);e.target.value=''}function resetDemo(){if(confirm('Esto reemplazará los datos actuales por la demo. ¿Continuar?')){db=clone(demo);save()}}
renderAll();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
